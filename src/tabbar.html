<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 38px;
    background: #161618;
    display: flex;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #8b8b8f;
    overflow: hidden;
    border-bottom: 1px solid #27272b;
    -webkit-app-region: drag;
  }

  .tabs {
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 6px;
    gap: 1px;
    flex: 1;
    overflow: hidden;
    -webkit-app-region: no-drag;
  }

  .tab {
    display: flex;
    align-items: center;
    height: 26px;
    padding: 0 6px 0 8px;
    border-radius: 5px;
    cursor: pointer;
    max-width: 200px;
    min-width: 72px;
    gap: 5px;
    flex-shrink: 1;
    transition: background 0.1s;
  }

  .tab:hover { background: #222225; }
  .tab.active { background: #28282c; color: #e0e0e5; }

  .tab-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
    background: #5e5ce6;
    opacity: 0.8;
  }

  .tab.active .tab-dot { opacity: 1; }

  .tab-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11.5px;
  }

  .tab-close {
    flex-shrink: 0;
    width: 14px;
    height: 14px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    font-size: 14px;
    color: #8b8b8f;
  }

  .tab:hover .tab-close,
  .tab.active .tab-close { opacity: 1; }
  .tab-close:hover { background: #3a3a3e; color: #e0e0e5; }

  .add-btn {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    color: #555;
    margin-right: 6px;
    -webkit-app-region: no-drag;
  }

  .add-btn:hover { background: #222225; color: #aaa; }
</style>
</head>
<body>
  <div class="tabs" id="tabs"></div>
  <div class="add-btn" id="addBtn" title="New tab (Ctrl+T)">+</div>

  <script>
    const tabsEl = document.getElementById('tabs');
    document.getElementById('addBtn').addEventListener('click', () => window.tabAPI.createTab());

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    window.tabAPI.onTabsUpdated((tabs) => {
      tabsEl.innerHTML = '';
      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'tab' + (tab.active ? ' active' : '');
        el.innerHTML = `
          <div class="tab-dot"></div>
          <span class="tab-title">${esc(tab.title)}</span>
          <span class="tab-close" data-close="${tab.index}">×</span>
        `;
        el.addEventListener('click', (e) => {
          const closeIndex = e.target.dataset.close;
          if (closeIndex !== undefined) {
            window.tabAPI.closeTab(parseInt(closeIndex));
          } else {
            window.tabAPI.switchTab(tab.index);
          }
        });
        tabsEl.appendChild(el);
      });
    });
  </script>
</body>
</html>
