appId: app.linear.linux
productName: Linear
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
linux:
  target:
    - AppImage
  category: Utility
  artifactName: linear-linux-${version}-${arch}.${ext}
appImage:
  artifactName: linear-linux-${version}-${arch}.${ext}
npmRebuild: false
