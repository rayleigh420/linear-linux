appId: app.linear.linux
productName: Linear
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
publish:
  provider: github
  owner: rayleigh420
  repo: linear-linux
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: rayleigh420 <rayleigh420@users.noreply.github.com>
  artifactName: linear-linux-${version}-${arch}.${ext}
  icon: resources/icon.png
  executableArgs:
    - --no-sandbox
    - --disable-dev-shm-usage
    - --disable-gpu-sandbox
deb:
  afterInstall: build/linux/postinst
npmRebuild: false
