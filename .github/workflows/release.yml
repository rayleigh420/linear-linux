name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (patch, minor, major)"
        required: false
        default: "patch"
  push:
    branches:
      - release

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Bump version and tag
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preview next version without committing
          NEXT=$(npm version "${BUMP:-patch}" --no-git-tag-version | tr -d 'v')
          git checkout -- package.json package-lock.json

          # If tag already exists (re-run after partial failure), reuse it
          if git ls-remote --tags origin | grep -q "refs/tags/v${NEXT}$"; then
            echo "Tag v${NEXT} already exists, reusing for re-run"
            npm version "${NEXT}" --no-git-tag-version
            git add package.json package-lock.json
            git diff --cached --quiet || git commit -m "chore: release ${NEXT} [skip ci]"
            git push || true
          else
            npm version "${BUMP:-patch}" -m "chore: release %s [skip ci]"
            git push
            git push --tags
          fi

          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.yml

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PAT }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Linear v${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.yml

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update flake.nix hashes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          X86_SRI=$(nix-hash --type sha256 --flat --sri dist/linear-linux-${VERSION}-x86_64.AppImage)
          ARM_SRI=$(nix-hash --type sha256 --flat --sri dist/linear-linux-${VERSION}-arm64.AppImage)

          sed -i "s|version = \".*\";|version = \"${VERSION}\";|" flake.nix
          sed -i "s|hash = \"sha256-.*\"; # x86_64|hash = \"${X86_SRI}\"; # x86_64|" flake.nix
          sed -i "s|hash = \"sha256-.*\"; # aarch64|hash = \"${ARM_SRI}\"; # aarch64|" flake.nix

          grep -q "${X86_SRI}" flake.nix || { echo "::error::Failed to update x86_64 hash"; exit 1; }
          grep -q "${ARM_SRI}" flake.nix || { echo "::error::Failed to update aarch64 hash"; exit 1; }

      - name: Commit flake.nix update
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          if git diff --cached --quiet; then
            echo "No changes to flake.nix"
          else
            git commit -m "chore: update flake.nix hashes for v${VERSION} [skip ci]"
            git pull --rebase origin release
            git push
          fi

      - name: Publish apt repository to the release
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The .deb files are release assets, NOT committed to git: an Electron .deb is
          # ~100MB and GitHub rejects any file >100MB pushed to a branch (this used to
          # push them to gh-pages and fail). Instead we host the whole flat apt repo on
          # the release itself — metadata assets sit next to the .deb files and apt reads
          # them from https://github.com/OWNER/REPO/releases/latest/download/.
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          sudo apt-get install -y --no-install-recommends dpkg-dev 2>/dev/null || true

          cd "$GITHUB_WORKSPACE/dist"

          # Public signing key
          gpg --armor --export rayleigh420@users.noreply.github.com > gpg.key

          # Generate apt metadata. Strip the leading "./" from Filename so each entry
          # resolves as a bare asset name under the release's /latest/download/ base URL.
          dpkg-scanpackages --multiversion . > Packages
          sed -i 's|^Filename: \./|Filename: |' Packages
          gzip -9 -k -f Packages

          # Generate Release file with checksums
          {
            echo "Origin: Linear Linux"
            echo "Label: Linear Linux"
            echo "Suite: stable"
            echo "Date: $(date -Ru)"
            echo "Architectures: amd64 arm64"
            echo "Components: ./"
            echo "MD5Sum:"
            for f in Packages Packages.gz; do
              printf " %s %d %s\n" "$(md5sum "$f" | cut -d' ' -f1)" "$(wc -c < "$f")" "$f"
            done
            echo "SHA256:"
            for f in Packages Packages.gz; do
              printf " %s %d %s\n" "$(sha256sum "$f" | cut -d' ' -f1)" "$(wc -c < "$f")" "$f"
            done
          } > Release

          # Sign
          gpg --batch --yes -abs -o Release.gpg Release
          gpg --batch --yes --clearsign -o InRelease Release

          # Attach the apt metadata to the release, next to the .deb assets.
          gh release upload "v${VERSION}" \
            Packages Packages.gz Release Release.gpg InRelease gpg.key \
            --clobber

      - name: Merge release back to master
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git fetch origin master
          git checkout master
          git merge release --no-ff -m "chore: merge release v${VERSION} into master [skip ci]"
          git push origin master
